name: Validate PowerShell Scripts

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ps1'
      - 'src/**/*.psm1'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ps1'
      - 'src/**/*.psm1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          
      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./src -Include *.ps1, *.psm1 -Recurse
          $results = @()
          
          foreach ($script in $scripts) {
              Write-Host "Analyzing: $($script.Name)"
              $analysis = Invoke-ScriptAnalyzer -Path $script.FullName
              
              if ($analysis) {
                  $results += $analysis
                  $analysis | ForEach-Object { Write-Host "  [$($_.Severity)] $($_.RuleName): $($_.Message)" }
              }
          }
          
          if ($results | Where-Object { $_.Severity -eq "Error" }) {
              Write-Host "❌ Linting failed!" -ForegroundColor Red
              exit 1
          }
          
          Write-Host "✓ All scripts passed linting" -ForegroundColor Green

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser
          
      - name: Run Pester Tests
        shell: pwsh
        run: |
          if (Test-Path ./tests) {
              $testResults = Invoke-Pester -Path ./tests -PassThru
              exit $testResults.FailedCount
          } else {
              Write-Host "No tests found" -ForegroundColor Yellow
          }
